<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 396"><rect width="760" height="396" x="0" y="0" fill="#FFF"/><defs><marker id="arr4" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#09090B" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="345" height="330" x="20" y="16" fill="#FFF" stroke="#05A451" stroke-width="1.5"/><text x="40" y="44" fill="#09090B" font-size="15" font-weight="700">Track A: linux-thox (production)</text><text x="40" y="64" fill="#3F3F46" font-size="12">GPL-2.0-only · the kernel shipping devices run</text><rect width="305" height="52" x="40" y="82" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="192" y="104" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Linux LTS base</text><text x="192" y="122" fill="#3F3F46" font-size="11.5" text-anchor="middle">6.6 LTS devices · 6.12 LTS desktop</text><line x1="192" x2="192" y1="134" y2="150" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/><rect width="305" height="52" x="40" y="154" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="192" y="176" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">THOX patch series (under 30 patches)</text><text x="192" y="194" fill="#3F3F46" font-size="11.5" text-anchor="middle">six families, each upstreamable in principle</text><rect width="305" height="52" x="40" y="222" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="192" y="244" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Published defconfigs</text><text x="192" y="262" fill="#3F3F46" font-size="11.5" text-anchor="middle">thox_e2 · thox_p4 · thox_p6 · thox_desktop</text><line x1="192" x2="192" y1="206" y2="218" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/><text x="40" y="300" fill="#B45309" font-size="12">Staging state: scaffold written; first import of the</text><text x="40" y="318" fill="#B45309" font-size="12">LTS tree and the defconfigs has not happened yet.</text><text x="40" y="336" fill="#3F3F46" font-size="12">The THOX delta reads as one commit series on the LTS tag.</text><line x1="380" x2="380" y1="16" y2="346" stroke="#09090B" stroke-dasharray="6 5" stroke-width="1.5"/><rect width="345" height="330" x="395" y="16" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="415" y="44" fill="#09090B" font-size="15" font-weight="700">Track B: Thox Kernel Lab (research)</text><text x="415" y="64" fill="#3F3F46" font-size="12">Apache-2.0 · experimental · never a shipping device</text><rect width="305" height="52" x="415" y="82" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="567" y="104" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Design documents only</text><text x="567" y="122" fill="#3F3F46" font-size="11.5" text-anchor="middle">retired kernel&apos;s DESIGN, agent model, invariants</text><line x1="567" x2="567" y1="134" y2="150" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/><rect width="305" height="52" x="415" y="154" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="567" y="176" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Clean-room specifications S1-S9</text><text x="567" y="194" fill="#3F3F46" font-size="11.5" text-anchor="middle">zero code ported (Gate G0b)</text><line x1="567" x2="567" y1="206" y2="218" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/><rect width="305" height="52" x="415" y="222" fill="#FFF" stroke="#09090B" stroke-dasharray="5 4" stroke-width="1"/><text x="567" y="244" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Future implementations</text><text x="567" y="262" fill="#3F3F46" font-size="11.5" text-anchor="middle">graduate as userspace services, by ADR</text><text x="415" y="300" fill="#B45309" font-size="12">Staging state: specifications extracted and</text><text x="415" y="318" fill="#B45309" font-size="12">indexed; no implementation code exists.</text><text x="415" y="336" fill="#3F3F46" font-size="12">One spec item is open by name: S9.3 wake policy.</text><text x="380" y="372" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">No code crosses the line in either direction.</text></svg>