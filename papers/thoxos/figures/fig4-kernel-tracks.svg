<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="396" fill="#FFFFFF"/>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#09090B"/>
    </marker>
  </defs>
  <!-- Track A -->
  <rect x="20" y="16" width="345" height="330" fill="#FFFFFF" stroke="#05A451" stroke-width="1.5"/>
  <text x="40" y="44" font-size="15" font-weight="700" fill="#09090B">Track A: linux-thox (production)</text>
  <text x="40" y="64" font-size="12" fill="#3F3F46">GPL-2.0-only &#183; the kernel shipping devices run</text>
  <rect x="40" y="82" width="305" height="52" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="192" y="104" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Linux LTS base</text>
  <text x="192" y="122" font-size="11.5" fill="#3F3F46" text-anchor="middle">6.6 LTS devices &#183; 6.12 LTS desktop</text>
  <line x1="192" y1="134" x2="192" y2="150" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="40" y="154" width="305" height="52" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="192" y="176" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">THOX patch series (under 30 patches)</text>
  <text x="192" y="194" font-size="11.5" fill="#3F3F46" text-anchor="middle">six families, each upstreamable in principle</text>
  <rect x="40" y="222" width="305" height="52" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="192" y="244" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Published defconfigs</text>
  <text x="192" y="262" font-size="11.5" fill="#3F3F46" text-anchor="middle">thox_e2 &#183; thox_p4 &#183; thox_p6 &#183; thox_desktop</text>
  <line x1="192" y1="206" x2="192" y2="218" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="40" y="300" font-size="12" fill="#B45309">Staging state: scaffold written; first import of the</text>
  <text x="40" y="318" font-size="12" fill="#B45309">LTS tree and the defconfigs has not happened yet.</text>
  <text x="40" y="336" font-size="12" fill="#3F3F46">The THOX delta reads as one commit series on the LTS tag.</text>
  <!-- Barrier -->
  <line x1="380" y1="16" x2="380" y2="346" stroke="#09090B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- Track B -->
  <rect x="395" y="16" width="345" height="330" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="415" y="44" font-size="15" font-weight="700" fill="#09090B">Track B: Thox Kernel Lab (research)</text>
  <text x="415" y="64" font-size="12" fill="#3F3F46">Apache-2.0 &#183; experimental &#183; never a shipping device</text>
  <rect x="415" y="82" width="305" height="52" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="567" y="104" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Design documents only</text>
  <text x="567" y="122" font-size="11.5" fill="#3F3F46" text-anchor="middle">retired kernel's DESIGN, agent model, invariants</text>
  <line x1="567" y1="134" x2="567" y2="150" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="415" y="154" width="305" height="52" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="567" y="176" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Clean-room specifications S1-S9</text>
  <text x="567" y="194" font-size="11.5" fill="#3F3F46" text-anchor="middle">zero code ported (Gate G0b)</text>
  <line x1="567" y1="206" x2="567" y2="218" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="415" y="222" width="305" height="52" fill="#FFFFFF" stroke="#09090B" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="567" y="244" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Future implementations</text>
  <text x="567" y="262" font-size="11.5" fill="#3F3F46" text-anchor="middle">graduate as userspace services, by ADR</text>
  <text x="415" y="300" font-size="12" fill="#B45309">Staging state: specifications extracted and</text>
  <text x="415" y="318" font-size="12" fill="#B45309">indexed; no implementation code exists.</text>
  <text x="415" y="336" font-size="12" fill="#3F3F46">One spec item is open by name: S9.3 wake policy.</text>
  <text x="380" y="372" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">No code crosses the line in either direction.</text>
</svg>