<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 356"><rect width="760" height="356" x="0" y="0" fill="#FFF"/><rect width="350" height="252" x="20" y="16" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/><text x="40" y="46" fill="#09090B" font-size="15" font-weight="700">Open and free: ThoxOS Core</text><text x="40" y="66" fill="#3F3F46" font-size="12">Runs on the user&apos;s own hardware and network</text><text x="40" y="98" fill="#09090B" font-size="13">• linux-thox kernel and Core OS</text><text x="40" y="124" fill="#09090B" font-size="13">• Local models and local inference</text><text x="40" y="150" fill="#09090B" font-size="13">• MeshStack Local: one home, own devices,</text><text x="56" y="168" fill="#09090B" font-size="13">local pooling</text><text x="40" y="194" fill="#09090B" font-size="13">• ThoxBeam Local, ThoxBridge local hub</text><text x="40" y="220" fill="#09090B" font-size="13">• A/B OTA with rollback, security updates</text><text x="40" y="246" fill="#09090B" font-size="13">• Developer SDK and virtual device lab</text><rect width="350" height="252" x="390" y="16" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="410" y="46" fill="#09090B" font-size="15" font-weight="700">Paid: THOX-hosted services</text><text x="410" y="66" fill="#3F3F46" font-size="12">Needs infrastructure THOX operates</text><text x="410" y="98" fill="#09090B" font-size="13">• Hosted relay, remote access, multi-site mesh</text><text x="410" y="124" fill="#09090B" font-size="13">• MagStack Scheduler Pro, KV sharing v2</text><text x="410" y="150" fill="#09090B" font-size="13">• ThoxRoute Cloud, ThoxMind cloud escalation</text><text x="410" y="176" fill="#09090B" font-size="13">• ThoxBrain Sync (hosted memory sync)</text><text x="410" y="202" fill="#09090B" font-size="13">• Premium model packs, ThoxWork</text><text x="410" y="228" fill="#09090B" font-size="13">• Fleet console, staged OTA rings</text><text x="410" y="254" fill="#09090B" font-size="13">• Compliance packs and SLA support</text><rect width="620" height="46" x="70" y="292" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1"/><text x="380" y="312" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">The line (Gate G0, 2026-10-29): if it runs completely on one device or the user&apos;s</text><text x="380" y="330" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">own network, it is open and free. If it needs THOX infrastructure, it is paid.</text></svg>