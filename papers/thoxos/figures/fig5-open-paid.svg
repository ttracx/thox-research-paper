<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="356" fill="#FFFFFF"/>
  <rect x="20" y="16" width="350" height="252" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/>
  <text x="40" y="46" font-size="15" font-weight="700" fill="#09090B">Open and free: ThoxOS Core</text>
  <text x="40" y="66" font-size="12" fill="#3F3F46">Runs on the user's own hardware and network</text>
  <text x="40" y="98" font-size="13" fill="#09090B">&#8226; linux-thox kernel and Core OS</text>
  <text x="40" y="124" font-size="13" fill="#09090B">&#8226; Local models and local inference</text>
  <text x="40" y="150" font-size="13" fill="#09090B">&#8226; MeshStack Local: one home, own devices,</text>
  <text x="56" y="168" font-size="13" fill="#09090B">local pooling</text>
  <text x="40" y="194" font-size="13" fill="#09090B">&#8226; ThoxBeam Local, ThoxBridge local hub</text>
  <text x="40" y="220" font-size="13" fill="#09090B">&#8226; A/B OTA with rollback, security updates</text>
  <text x="40" y="246" font-size="13" fill="#09090B">&#8226; Developer SDK and virtual device lab</text>
  <rect x="390" y="16" width="350" height="252" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="410" y="46" font-size="15" font-weight="700" fill="#09090B">Paid: THOX-hosted services</text>
  <text x="410" y="66" font-size="12" fill="#3F3F46">Needs infrastructure THOX operates</text>
  <text x="410" y="98" font-size="13" fill="#09090B">&#8226; Hosted relay, remote access, multi-site mesh</text>
  <text x="410" y="124" font-size="13" fill="#09090B">&#8226; MagStack Scheduler Pro, KV sharing v2</text>
  <text x="410" y="150" font-size="13" fill="#09090B">&#8226; ThoxRoute Cloud, ThoxMind cloud escalation</text>
  <text x="410" y="176" font-size="13" fill="#09090B">&#8226; ThoxBrain Sync (hosted memory sync)</text>
  <text x="410" y="202" font-size="13" fill="#09090B">&#8226; Premium model packs, ThoxWork</text>
  <text x="410" y="228" font-size="13" fill="#09090B">&#8226; Fleet console, staged OTA rings</text>
  <text x="410" y="254" font-size="13" fill="#09090B">&#8226; Compliance packs and SLA support</text>
  <rect x="70" y="292" width="620" height="46" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1"/>
  <text x="380" y="312" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">The line (Gate G0, 2026-10-29): if it runs completely on one device or the user's</text>
  <text x="380" y="330" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">own network, it is open and free. If it needs THOX infrastructure, it is paid.</text>
</svg>