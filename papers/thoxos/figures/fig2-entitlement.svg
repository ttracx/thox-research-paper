<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 348"><rect width="760" height="348" x="0" y="0" fill="#FFF"/><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#09090B" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="215" height="86" x="20" y="30" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="127" y="58" fill="#09090B" font-size="14" font-weight="700" text-anchor="middle">THOX entitlement service</text><text x="127" y="78" fill="#3F3F46" font-size="12" text-anchor="middle">hosted; issues a signed token</text><text x="127" y="96" fill="#3F3F46" font-size="12" text-anchor="middle">after sign-in for paid services</text><rect width="215" height="86" x="275" y="30" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/><text x="382" y="58" fill="#09090B" font-size="14" font-weight="700" text-anchor="middle">Device: thox-entitlementd</text><text x="382" y="78" fill="#3F3F46" font-size="12" text-anchor="middle">verifies the signature locally</text><text x="382" y="96" fill="#3F3F46" font-size="12" text-anchor="middle">no network call, works offline</text><rect width="215" height="86" x="530" y="30" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="637" y="54" fill="#09090B" font-size="14" font-weight="700" text-anchor="middle">Verification state</text><text x="637" y="74" fill="#09090B" font-size="12" text-anchor="middle">valid · grace (30 days past expiry)</text><text x="637" y="92" fill="#09090B" font-size="12" text-anchor="middle">expired · invalid</text><line x1="235" x2="271" y1="73" y2="73" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/><line x1="490" x2="526" y1="73" y2="73" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/><rect width="480" height="92" x="140" y="160" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="380" y="186" fill="#09090B" font-size="14" font-weight="700" text-anchor="middle">Feature gate (decision D4)</text><text x="380" y="208" fill="#09090B" font-size="12.5" text-anchor="middle">Free Core features: allowed in every state, checked before the token is read.</text><text x="380" y="228" fill="#09090B" font-size="12.5" text-anchor="middle">Paid features: allowed only when listed on the token and state is valid or grace.</text><line x1="380" x2="380" y1="116" y2="156" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/><rect width="580" height="44" x="90" y="282" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1"/><text x="380" y="301" fill="#09090B" font-size="12.5" text-anchor="middle">No DRM and no kill switch in Core. Paid features are also enforced</text><text x="380" y="319" fill="#09090B" font-size="12.5" text-anchor="middle">server-side, on the THOX services themselves.</text></svg>