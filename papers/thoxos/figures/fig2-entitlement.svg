<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="348" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#09090B"/>
    </marker>
  </defs>
  <!-- Box A -->
  <rect x="20" y="30" width="215" height="86" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="127" y="58" font-size="14" font-weight="700" fill="#09090B" text-anchor="middle">THOX entitlement service</text>
  <text x="127" y="78" font-size="12" fill="#3F3F46" text-anchor="middle">hosted; issues a signed token</text>
  <text x="127" y="96" font-size="12" fill="#3F3F46" text-anchor="middle">after sign-in for paid services</text>
  <!-- Box B -->
  <rect x="275" y="30" width="215" height="86" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/>
  <text x="382" y="58" font-size="14" font-weight="700" fill="#09090B" text-anchor="middle">Device: thox-entitlementd</text>
  <text x="382" y="78" font-size="12" fill="#3F3F46" text-anchor="middle">verifies the signature locally</text>
  <text x="382" y="96" font-size="12" fill="#3F3F46" text-anchor="middle">no network call, works offline</text>
  <!-- Box C -->
  <rect x="530" y="30" width="215" height="86" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="637" y="54" font-size="14" font-weight="700" fill="#09090B" text-anchor="middle">Verification state</text>
  <text x="637" y="74" font-size="12" fill="#09090B" text-anchor="middle">valid &#183; grace (30 days past expiry)</text>
  <text x="637" y="92" font-size="12" fill="#09090B" text-anchor="middle">expired &#183; invalid</text>
  <!-- arrows -->
  <line x1="235" y1="73" x2="271" y2="73" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="73" x2="526" y2="73" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Gate box -->
  <rect x="140" y="160" width="480" height="92" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="380" y="186" font-size="14" font-weight="700" fill="#09090B" text-anchor="middle">Feature gate (decision D4)</text>
  <text x="380" y="208" font-size="12.5" fill="#09090B" text-anchor="middle">Free Core features: allowed in every state, checked before the token is read.</text>
  <text x="380" y="228" font-size="12.5" fill="#09090B" text-anchor="middle">Paid features: allowed only when listed on the token and state is valid or grace.</text>
  <line x1="380" y1="116" x2="380" y2="156" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Note -->
  <rect x="90" y="282" width="580" height="44" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1"/>
  <text x="380" y="301" font-size="12.5" fill="#09090B" text-anchor="middle">No DRM and no kill switch in Core. Paid features are also enforced</text>
  <text x="380" y="319" font-size="12.5" fill="#09090B" text-anchor="middle">server-side, on the THOX services themselves.</text>
</svg>