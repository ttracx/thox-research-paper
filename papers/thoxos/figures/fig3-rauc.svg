<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#09090B"/>
    </marker>
    <marker id="arr3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#05A451"/>
    </marker>
  </defs>
  <!-- Slot diagram -->
  <rect x="20" y="18" width="150" height="40" fill="#E9F7EF" stroke="#05A451" stroke-width="1.2"/>
  <text x="95" y="43" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Slot A (running)</text>
  <rect x="178" y="18" width="150" height="40" fill="#FFFFFF" stroke="#09090B" stroke-width="1"/>
  <text x="253" y="43" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Slot B (idle)</text>
  <rect x="336" y="18" width="190" height="40" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/>
  <text x="431" y="43" font-size="12.5" font-weight="700" fill="#09090B" text-anchor="middle">Data partition (untouched)</text>
  <text x="545" y="43" font-size="12" fill="#3F3F46">Updates are written only to the idle slot.</text>
  <!-- Flow boxes -->
  <rect x="20" y="100" width="128" height="64" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="84" y="126" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">1. Download</text>
  <text x="84" y="145" font-size="11.5" fill="#3F3F46" text-anchor="middle">signed bundle staged</text>
  <rect x="168" y="100" width="128" height="64" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="232" y="126" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">2. Verify</text>
  <text x="232" y="145" font-size="11.5" fill="#3F3F46" text-anchor="middle">signature + hashes</text>
  <rect x="316" y="100" width="128" height="64" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="380" y="126" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">3. Install</text>
  <text x="380" y="145" font-size="11.5" fill="#3F3F46" text-anchor="middle">to the idle slot</text>
  <rect x="464" y="100" width="128" height="64" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="528" y="126" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">4. Reboot</text>
  <text x="528" y="145" font-size="11.5" fill="#3F3F46" text-anchor="middle">attempt counter set</text>
  <rect x="612" y="100" width="128" height="64" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/>
  <text x="676" y="126" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">5. Health gate</text>
  <text x="676" y="145" font-size="11.5" fill="#3F3F46" text-anchor="middle">thoxd, portal, mesh</text>
  <line x1="148" y1="132" x2="164" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="296" y1="132" x2="312" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="444" y1="132" x2="460" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="592" y1="132" x2="608" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Outcomes -->
  <rect x="470" y="220" width="270" height="52" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/>
  <text x="605" y="242" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">Pass: slot marked good</text>
  <text x="605" y="260" font-size="11.5" fill="#3F3F46" text-anchor="middle">the new slot becomes the standing system</text>
  <rect x="20" y="220" width="400" height="52" fill="#FFFFFF" stroke="#09090B" stroke-width="1.2"/>
  <text x="220" y="242" font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">Fail, boot failure, or counter exhausted: automatic rollback</text>
  <text x="220" y="260" font-size="11.5" fill="#3F3F46" text-anchor="middle">previous slot boots; failed slot marked bad; data intact</text>
  <path d="M 640 164 L 640 216" stroke="#05A451" stroke-width="1.5" marker-end="url(#arr3g)"/>
  <path d="M 676 190 L 676 300 L 220 300 L 220 276" fill="none" stroke="#09090B" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr3)"/>
  <text x="448" y="294" font-size="11.5" fill="#3F3F46">no user action required</text>
  <text x="232" y="196" font-size="11.5" fill="#3F3F46" text-anchor="middle">mismatch = hard reject, nothing installed</text>
</svg>