<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 330"><rect width="760" height="330" x="0" y="0" fill="#FFF"/><defs><marker id="arr3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#09090B" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arr3g" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#05A451" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="150" height="40" x="20" y="18" fill="#E9F7EF" stroke="#05A451" stroke-width="1.2"/><text x="95" y="43" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Slot A (running)</text><rect width="150" height="40" x="178" y="18" fill="#FFF" stroke="#09090B" stroke-width="1"/><text x="253" y="43" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Slot B (idle)</text><rect width="190" height="40" x="336" y="18" fill="#F4F4F5" stroke="#09090B" stroke-width="1"/><text x="431" y="43" fill="#09090B" font-size="12.5" font-weight="700" text-anchor="middle">Data partition (untouched)</text><text x="545" y="43" fill="#3F3F46" font-size="12">Updates are written only to the idle slot.</text><rect width="128" height="64" x="20" y="100" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="84" y="126" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">1. Download</text><text x="84" y="145" fill="#3F3F46" font-size="11.5" text-anchor="middle">signed bundle staged</text><rect width="128" height="64" x="168" y="100" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="232" y="126" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">2. Verify</text><text x="232" y="145" fill="#3F3F46" font-size="11.5" text-anchor="middle">signature + hashes</text><rect width="128" height="64" x="316" y="100" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="380" y="126" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">3. Install</text><text x="380" y="145" fill="#3F3F46" font-size="11.5" text-anchor="middle">to the idle slot</text><rect width="128" height="64" x="464" y="100" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="528" y="126" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">4. Reboot</text><text x="528" y="145" fill="#3F3F46" font-size="11.5" text-anchor="middle">attempt counter set</text><rect width="128" height="64" x="612" y="100" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/><text x="676" y="126" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">5. Health gate</text><text x="676" y="145" fill="#3F3F46" font-size="11.5" text-anchor="middle">thoxd, portal, mesh</text><line x1="148" x2="164" y1="132" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/><line x1="296" x2="312" y1="132" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/><line x1="444" x2="460" y1="132" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/><line x1="592" x2="608" y1="132" y2="132" stroke="#09090B" stroke-width="1.5" marker-end="url(#arr3)"/><rect width="270" height="52" x="470" y="220" fill="#E9F7EF" stroke="#05A451" stroke-width="1.5"/><text x="605" y="242" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">Pass: slot marked good</text><text x="605" y="260" fill="#3F3F46" font-size="11.5" text-anchor="middle">the new slot becomes the standing system</text><rect width="400" height="52" x="20" y="220" fill="#FFF" stroke="#09090B" stroke-width="1.2"/><text x="220" y="242" fill="#09090B" font-size="13" font-weight="700" text-anchor="middle">Fail, boot failure, or counter exhausted: automatic rollback</text><text x="220" y="260" fill="#3F3F46" font-size="11.5" text-anchor="middle">previous slot boots; failed slot marked bad; data intact</text><path stroke="#05A451" stroke-width="1.5" marker-end="url(#arr3g)" d="M 640 164 L 640 216"/><path fill="none" stroke="#09090B" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#arr3)" d="M 676 190 L 676 300 L 220 300 L 220 276"/><text x="448" y="294" fill="#3F3F46" font-size="11.5">no user action required</text><text x="232" y="196" fill="#3F3F46" font-size="11.5" text-anchor="middle">mismatch = hard reject, nothing installed</text></svg>