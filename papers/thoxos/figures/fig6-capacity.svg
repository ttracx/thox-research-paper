<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
  <!-- plot area: baseline y=330, scale 48 px per GB, top 6 GB at y=42 -->
  <line x1="80" y1="330" x2="720" y2="330" stroke="#09090B" stroke-width="1.2"/>
  <g font-size="11.5" fill="#3F3F46">
    <text x="70" y="334" text-anchor="end">0</text>
    <text x="70" y="286" text-anchor="end">1</text>
    <text x="70" y="238" text-anchor="end">2</text>
    <text x="70" y="190" text-anchor="end">3</text>
    <text x="70" y="142" text-anchor="end">4</text>
    <text x="70" y="94" text-anchor="end">5</text>
    <text x="70" y="46" text-anchor="end">6 GB</text>
  </g>
  <g stroke="#E4E4E7" stroke-width="1">
    <line x1="80" y1="282" x2="720" y2="282"/>
    <line x1="80" y1="234" x2="720" y2="234"/>
    <line x1="80" y1="186" x2="720" y2="186"/>
    <line x1="80" y1="138" x2="720" y2="138"/>
    <line x1="80" y1="90" x2="720" y2="90"/>
    <line x1="80" y1="42" x2="720" y2="42"/>
  </g>
  <!-- Bars: E2 2GB h=96 y=234; P4 4GB h=192 y=138; P6 6GB h=288 y=42 -->
  <rect x="140" y="234" width="110" height="96" fill="#05A451"/>
  <rect x="320" y="138" width="110" height="192" fill="#05A451"/>
  <rect x="500" y="42" width="110" height="288" fill="#05A451"/>
  <g font-size="13" font-weight="700" fill="#09090B" text-anchor="middle">
    <text x="195" y="222">2 GB</text>
    <text x="375" y="126">4 GB</text>
    <text x="555" y="30">6 GB</text>
    <text x="195" y="354">E2 (ThoxAir class)</text>
    <text x="375" y="354">P4 (ThoxMini class)</text>
    <text x="555" y="354">P6 (ThoxClip class)</text>
  </g>
  <!-- GGUF lines: Air 0.40 GB -> y=330-19=311 ; Mini 2.49 GB -> y=330-120=210 -->
  <line x1="80" y1="311" x2="720" y2="311" stroke="#09090B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <line x1="80" y1="210" x2="720" y2="210" stroke="#09090B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <g font-size="12" fill="#09090B">
    <text x="716" y="303" text-anchor="end" font-weight="700">ThoxAir-0.5B Q4_K_M: 0.40 GB file</text>
    <text x="716" y="202" text-anchor="end" font-weight="700">ThoxMini-Phi4Mini Q4_K_M: 2.49 GB file</text>
  </g>
  <text x="80" y="386" font-size="11.5" fill="#3F3F46">Bars: RAM floors from the staging class definitions. Dashed lines: published GGUF file sizes (programme record). Derived, not measured.</text>
</svg>